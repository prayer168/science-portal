<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黑熊老師自然科學數位教材中心</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --g3:#FF6B6B; --g4:#FF9F43; --g5:#1DD1A1; --g6:#54A0FF;
    --fun:#A29BFE; --app:#00B894;
    --bg:#111216; --text:#e8eaed; --text-sub:#9aa0a6;
    --card-bg:#1a1d24; --sidebar-bg:#1a1d24;
    --border:#252833; --border-soft:#1e2130;
    --shadow:0 1px 3px rgba(0,0,0,0.5);
    --accent:#4db8ff;
    --radius:12px; --radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  /* HEADER - horizontal nav bar */
  header{background:#0c0e13;border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;height:62px;position:sticky;top:0;z-index:100;}
  .header-inner{display:flex;align-items:center;gap:14px;max-width:1200px;margin:0 auto;width:100%;}
  .header-icon{display:none;}
  .header-bear{display:block;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5));}
  .header-title-wrap{flex:1;min-width:0;}
  header h1{font-family:'Nunito','Noto Sans TC',sans-serif;font-size:clamp(13px,2vw,18px);font-weight:900;color:#e8eaed;letter-spacing:0.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header p{color:#6b7280;font-size:11px;margin-top:1px;}
  .bear-badge{display:none;}

  /* HEADER BUTTONS */
  .header-btns{display:flex;gap:8px;align-items:center;flex-shrink:0;}
  .manage-toggle{background:rgba(77,184,255,0.1);border:1px solid rgba(77,184,255,0.25);color:#4db8ff;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:'Noto Sans TC',sans-serif;}
  .manage-toggle:hover{background:rgba(77,184,255,0.2);}
  .manage-toggle.active{background:#4db8ff;color:#0c0e13;border-color:#4db8ff;}
  .btn-signout{background:rgba(154,160,166,0.1);border:1px solid rgba(154,160,166,0.2);color:#9aa0a6;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:'Noto Sans TC',sans-serif;display:none;}
  .btn-signout:hover{background:rgba(154,160,166,0.2);color:#e8eaed;}
  .user-avatar{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:none;vertical-align:middle;}

  /* PAGE LAYOUT - two columns */
  .page-wrap{display:grid;grid-template-columns:1fr 236px;gap:0;max-width:1200px;margin:0 auto;padding:0 24px;align-items:start;}
  .main-col{min-width:0;}
  .sidebar{position:sticky;top:70px;padding:20px 0 20px 20px;}
  .sidebar-box{background:var(--sidebar-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px 14px;}
  .sidebar-title{font-size:10px;font-weight:700;color:#6b7280;margin-bottom:10px;letter-spacing:2px;text-transform:uppercase;}

  /* LOGIN OVERLAY */
  .login-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;}
  .login-overlay.hidden{display:none;}
  .login-box{background:#161b22;border:1px solid var(--border);border-radius:16px;padding:36px 32px;text-align:center;max-width:360px;width:90%;box-shadow:0 24px 60px rgba(0,0,0,0.6);animation:popIn 0.3s cubic-bezier(.34,1.56,.64,1);}
  @keyframes popIn{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}
  .login-icon{font-size:48px;margin-bottom:12px;}
  .login-title{font-size:18px;font-weight:900;color:#e6edf3;margin-bottom:6px;font-family:'Nunito',sans-serif;}
  .login-sub{font-size:13px;color:#8b949e;margin-bottom:24px;line-height:1.6;}
  .btn-google-login{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:12px 20px;border:1px solid var(--border);border-radius:10px;background:#21262d;cursor:pointer;font-size:14px;font-weight:700;color:#e6edf3;font-family:'Noto Sans TC',sans-serif;transition:all 0.2s;}
  .btn-google-login:hover{background:#30363d;border-color:#58a6ff;}
  .btn-google-login img{width:20px;height:20px;}
  .login-hint{margin-top:14px;font-size:11px;color:#484f58;}
  .login-error{margin-top:10px;font-size:13px;color:#f85149;font-weight:600;min-height:20px;}
  .login-loading{margin-top:10px;font-size:13px;color:#58a6ff;display:none;}

  /* TABS - vertical sidebar */
  .tab-bar{display:flex;flex-direction:column;gap:2px;}
  .tab-btn{font-family:'Noto Sans TC',sans-serif;font-weight:600;font-size:13px;border:none;border-left:3px solid transparent;cursor:pointer;border-radius:0 6px 6px 0;padding:7px 10px;transition:all 0.18s;white-space:nowrap;background:transparent;color:#8b949e;text-align:left;width:100%;}
  .tab-btn .tab-count{display:inline-block;background:rgba(139,148,158,0.12);color:#8b949e;font-size:10px;border-radius:20px;padding:1px 5px;margin-left:4px;font-weight:700;vertical-align:middle;}
  .tab-btn.active{color:var(--text);background:rgba(255,255,255,0.06);border-left-color:var(--accent);}
  .tab-btn.active .tab-count{background:rgba(77,184,255,0.15);color:#4db8ff;}
  .tab-btn:not(.active):hover{color:#c9d1d9;background:rgba(255,255,255,0.04);}

  /* MANAGE PANEL */
  .manage-panel{display:none;padding:16px 16px 0;}
  .manage-panel.open{display:block;animation:fadeUp 0.25s ease;}
  .panel-box{background:#161b22;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:1px solid var(--border);}
  .panel-title{font-size:15px;font-weight:800;color:#58a6ff;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .add-form{display:grid;grid-template-columns:180px 1fr 2fr auto;gap:10px;align-items:end;}
  .form-group{display:flex;flex-direction:column;gap:5px;}
  .form-group label{font-size:12px;font-weight:700;color:var(--text-sub);letter-spacing:0.5px;}
  .form-group select,.form-group input{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;font-family:'Noto Sans TC',sans-serif;color:var(--text);outline:none;transition:border-color 0.2s;background:#21262d;width:100%;}
  .form-group select:focus,.form-group input:focus{border-color:#58a6ff;background:#0d1117;}
  .btn-add{background:#238636;color:#fff;border:1px solid #2ea043;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all 0.2s;white-space:nowrap;height:40px;align-self:end;}
  .btn-add:hover{background:#2ea043;box-shadow:0 0 12px rgba(46,160,67,0.4);}
  .toast{display:inline-block;margin-left:12px;font-size:13px;font-weight:600;color:#3fb950;opacity:0;transition:opacity 0.3s;}
  .toast.show{opacity:1;}
  .manage-list-header{display:flex;align-items:center;justify-content:space-between;margin-top:18px;margin-bottom:8px;gap:10px;flex-wrap:wrap;}
  .manage-list-title{font-size:13px;font-weight:700;color:var(--text-sub);}
  .manage-filter{border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:13px;font-family:'Noto Sans TC',sans-serif;outline:none;color:var(--text);background:#21262d;}
  .manage-filter:focus{border-color:#58a6ff;}
  .manage-table{width:100%;border-collapse:collapse;}
  .manage-table th{text-align:left;font-size:11px;font-weight:700;color:var(--text-sub);padding:8px 10px;border-bottom:1px solid var(--border);letter-spacing:0.5px;text-transform:uppercase;}
  .manage-table td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;color:var(--text);}
  .manage-table tr:last-child td{border-bottom:none;}
  .manage-table tr:hover td{background:#21262d;}
  .manage-table tr.row-checked td{background:#1a2030;}
  .manage-table th:first-child,.manage-table td:first-child{width:36px;padding-right:4px;}
  .row-cb{width:16px;height:16px;accent-color:#58a6ff;cursor:pointer;vertical-align:middle;}
  .th-cb{width:16px;height:16px;accent-color:#58a6ff;cursor:pointer;vertical-align:middle;}
  .cat-badge{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;}
  .td-name{font-weight:600;max-width:180px;color:var(--text);}
  .td-url{color:var(--text-sub);font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .td-url a{color:#58a6ff;text-decoration:none;}
  .td-url a:hover{text-decoration:underline;}
  .btn-del{background:transparent;color:#f85149;border:1px solid #6e2a2a;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.18s;font-family:'Noto Sans TC',sans-serif;}
  .btn-del:hover{background:#6e2a2a;color:#fff;border-color:#f85149;}
  .btn-move{background:transparent;color:#58a6ff;border:1px solid #1a3a5c;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.18s;font-family:'Noto Sans TC',sans-serif;white-space:nowrap;}
  .btn-move:hover{background:#1a3a5c;border-color:#58a6ff;}
  .move-select{border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-size:12px;font-family:'Noto Sans TC',sans-serif;outline:none;color:var(--text);background:#21262d;cursor:pointer;max-width:100px;}
  .move-select:focus{border-color:#58a6ff;}
  .td-actions{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;}
  .batch-bar{display:none;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 14px;background:#1a0e0e;border:1px solid #6e2a2a;border-radius:10px;}
  .batch-bar.show{display:flex;animation:fadeUp 0.2s ease;}
  .batch-count{font-size:13px;font-weight:700;color:#f85149;}
  .btn-batch-del{background:#6e2a2a;color:#f85149;border:1px solid #f85149;border-radius:6px;padding:6px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all 0.18s;}
  .btn-batch-del:hover{background:#f85149;color:#fff;}
  .btn-batch-cancel{background:transparent;color:#8b949e;border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all 0.18s;}
  .btn-batch-cancel:hover{border-color:#8b949e;color:#e6edf3;}
  .export-row{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .btn-export{background:transparent;color:#58a6ff;border:1px solid #1a3a5c;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.18s;font-family:'Noto Sans TC',sans-serif;}
  .btn-export:hover{background:#1a3a5c;border-color:#58a6ff;}
  .export-hint{font-size:11px;color:var(--text-sub);}

  /* EXPORT PACK */
  .export-pack-box{margin-top:16px;padding:16px 18px;background:#0d1117;border:1px solid var(--border);border-radius:var(--radius-sm);}
  .export-pack-title{font-size:14px;font-weight:800;color:#e8eaed;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
  .export-pack-desc{font-size:12px;color:var(--text-sub);margin-bottom:12px;}
  .export-format-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-fmt{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid;transition:all 0.18s;font-family:'Noto Sans TC',sans-serif;white-space:nowrap;}
  .btn-fmt-md{background:rgba(77,184,255,0.08);color:#4db8ff;border-color:rgba(77,184,255,0.3);}
  .btn-fmt-md:hover{background:rgba(77,184,255,0.18);border-color:#4db8ff;}
  .btn-fmt-html{background:rgba(255,159,67,0.08);color:#FF9F43;border-color:rgba(255,159,67,0.3);}
  .btn-fmt-html:hover{background:rgba(255,159,67,0.18);border-color:#FF9F43;}
  .btn-fmt-pdf{background:rgba(248,81,73,0.08);color:#f85149;border-color:rgba(248,81,73,0.3);}
  .btn-fmt-pdf:hover{background:rgba(248,81,73,0.18);border-color:#f85149;}
  .btn-fmt-docx{background:rgba(63,185,80,0.08);color:#3fb950;border-color:rgba(63,185,80,0.3);}
  .btn-fmt-docx:hover{background:rgba(63,185,80,0.18);border-color:#3fb950;}

  /* RENAME */
  .btn-rename{background:transparent;color:#58a6ff;border:1px solid #1a3a5c;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.18s;font-family:'Noto Sans TC',sans-serif;white-space:nowrap;}
  .btn-rename:hover{background:#1a3a5c;border-color:#58a6ff;}
  .rename-wrap{display:flex;align-items:center;gap:4px;}
  .rename-input{border:1px solid #58a6ff;border-radius:6px;padding:4px 8px;font-size:13px;font-family:'Noto Sans TC',sans-serif;outline:none;width:130px;color:var(--text);background:#21262d;}
  .btn-confirm-sm{background:#1a3a20;color:#3fb950;border:1px solid #2ea043;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.18s;}
  .btn-confirm-sm:hover{background:#2ea043;color:#fff;}
  .btn-cancel-sm{background:transparent;color:#8b949e;border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.18s;}
  .btn-cancel-sm:hover{border-color:#8b949e;color:#e6edf3;}

  /* SYNC STATUS */
  .sync-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .sync-status{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:#21262d;border:1px solid var(--border);transition:color 0.3s;letter-spacing:0.3px;color:var(--text-sub);}

  /* DATA LOADING */
  .data-loading{text-align:center;padding:48px 20px;color:#58a6ff;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .loading-spinner{width:36px;height:36px;border:3px solid #21262d;border-top-color:#58a6ff;border-radius:50%;animation:spin 0.75s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* CATEGORY MANAGEMENT */
  .cat-manage-box{margin-top:20px;padding-top:18px;border-top:1px dashed var(--border);}
  .cat-manage-title{font-size:14px;font-weight:800;color:#58a6ff;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .cat-add-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .cat-input{border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:14px;font-family:'Noto Sans TC',sans-serif;outline:none;transition:border-color 0.2s;background:#21262d;color:var(--text);width:80px;}
  .cat-input:focus{border-color:#58a6ff;}
  .cat-input.wide{width:140px;}
  .btn-cat-add{background:#238636;color:#fff;border:1px solid #2ea043;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all 0.2s;white-space:nowrap;}
  .btn-cat-add:hover{background:#2ea043;}
  .cat-list{display:flex;flex-wrap:wrap;gap:8px;}
  .cat-tag{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:700;color:#fff;position:relative;}
  .cat-tag.locked{opacity:0.6;padding-right:12px;}
  .cat-tag-del{background:rgba(0,0,0,0.3);border:none;color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;font-weight:900;transition:background 0.15s;padding:0;}
  .cat-tag-del:hover{background:rgba(0,0,0,0.6);}
  .cat-tag-rename{background:rgba(0,0,0,0.25);border:none;color:#fff;border-radius:4px;padding:1px 5px;font-size:10px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:700;transition:background 0.15s;margin-left:2px;}
  .cat-tag-rename:hover{background:rgba(255,255,255,0.25);}
  .cat-rename-input{background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.4);border-radius:4px;color:#fff;font-size:12px;font-weight:700;font-family:'Noto Sans TC',sans-serif;padding:1px 6px;width:80px;outline:none;}
  .cat-lock-hint{font-size:11px;color:#484f58;margin-top:8px;}

  /* CONTENT */
  .content-area{padding:16px 16px 48px;}
  .category-section{display:none;}
  .category-section.active{display:block;animation:fadeUp 0.28s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .section-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:12px 16px;border-radius:var(--radius-sm);background:#161b22;border:1px solid var(--border);}
  .section-emoji{font-size:28px;}
  .section-title{font-family:'Nunito','Noto Sans TC',sans-serif;font-size:17px;font-weight:900;letter-spacing:0.5px;color:var(--text);}
  .section-subtitle{font-size:11px;color:var(--text-sub);margin-top:2px;}
  .card-grid{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);}
  .card{background:var(--card-bg);padding:13px 18px;cursor:pointer;text-decoration:none;color:var(--text);transition:background 0.15s;display:flex;flex-direction:row;align-items:center;gap:14px;border:none;position:relative;}
  .card:hover{background:#1c2128;}
  .card::before{display:none;}
  .card-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .card-name{font-size:14px;font-weight:600;line-height:1.4;color:var(--text);flex:1;}
  .card-arrow{font-size:12px;font-weight:700;color:var(--text-sub);flex-shrink:0;margin-top:0;}
  .empty-state{text-align:center;padding:36px 20px;color:var(--text-sub);font-size:14px;}
  .empty-state .empty-icon{font-size:36px;margin-bottom:10px;}

  footer{text-align:center;padding:20px;color:#484f58;font-size:12px;border-top:1px solid var(--border);}
  @media(max-width:760px){
    .page-wrap{grid-template-columns:1fr;}
    .sidebar{position:static;padding:0;order:-1;}
    .sidebar-box{border-radius:0;border-left:none;border-right:none;}
    .tab-bar{flex-direction:row;flex-wrap:wrap;gap:4px;padding:10px 12px;}
    .tab-btn{border-left:none;border-bottom:3px solid transparent;border-radius:6px;width:auto;padding:6px 12px;}
    .tab-btn.active{border-bottom-color:var(--accent);background:rgba(255,255,255,0.08);}
  }
  @media(max-width:640px){.add-form{grid-template-columns:1fr 1fr;}}
  @media(max-width:480px){.add-form{grid-template-columns:1fr;}.manage-toggle{padding:6px 10px;font-size:12px;}}
</style>
</head>
<body>

<!-- Google 登入彈窗 -->
<div class="login-overlay hidden" id="loginOverlay">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <div class="login-title">管理員登入</div>
    <div class="login-sub">此功能僅限授權帳號使用<br>請用指定的 Google 帳號登入</div>
    <button class="btn-google-login" id="btnGoogleLogin">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      使用 Google 帳號登入
    </button>
    <div class="login-error" id="loginError"></div>
    <div class="login-loading" id="loginLoading">⏳ 登入中，請稍候...</div>
    <div class="login-hint">僅 prayer168@gmail.com 可進入管理後台</div>
  </div>
</div>

<header>
  <div class="header-inner">
    <div class="header-bear">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 112" width="42" height="47">
        <ellipse cx="50" cy="86" rx="28" ry="24" fill="#111827"/>
        <circle cx="50" cy="50" r="26" fill="#111827"/>
        <circle cx="27" cy="27" r="12" fill="#111827"/>
        <circle cx="73" cy="27" r="12" fill="#111827"/>
        <circle cx="27" cy="27" r="6.5" fill="#7c3f4f"/>
        <circle cx="73" cy="27" r="6.5" fill="#7c3f4f"/>
        <ellipse cx="50" cy="59" rx="13" ry="10" fill="#3b2213"/>
        <circle cx="41" cy="45" r="5.5" fill="white"/>
        <circle cx="59" cy="45" r="5.5" fill="white"/>
        <circle cx="42" cy="45" r="3.5" fill="#111"/>
        <circle cx="60" cy="45" r="3.5" fill="#111"/>

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut as fbSignOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2DSmaCFEWETra0JH2M4zZrkc0DvkrKFg",
  authDomain: "science-portal-8b814.firebaseapp.com",

  storageBucket: "science-portal-8b814.firebasestorage.app",
  messagingSenderId: "428053709401",
  appId: "1:428053709401:web:d322b970fe6e868c1d6748",
  measurementId: "G-8L2VPDNP3N"
};

const ALLOWED_EMAIL = "prayer168@gmail.com";
const app      = initializeApp(firebaseConfig);
const auth     = getAuth(app);
const db       = getFirestore(app);
const provider = new GoogleAuthProvider();
const portalDoc = doc(db, 'portal', 'v1');

// ── 同步狀態 UI ──
function setSyncStatus(status) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const map = {
    loading: ['⏳ 連線中…',  '#a29bfe'],
    synced:  ['☁️ 已同步',   '#00b894'],
    saving:  ['⏳ 儲存中…',  '#fdcb6e'],
    error:   ['⚠️ 儲存失敗', '#e17055'],
    offline: ['📴 離線模式', '#b2bec3'],
  };
  const [text, color] = map[status] || map.synced;
  el.textContent = text;
  el.style.color  = color;
}

// ── Firestore 即時監聽 ──
onSnapshot(portalDoc, (snap) => {
  const loadingEl = document.getElementById('dataLoadingEl');
  if (loadingEl) loadingEl.remove();

  if (snap.exists()) {
    const data = snap.data();
    const materials   = Array.isArray(data.materials)   ? data.materials   : null;
    const customCats  = Array.isArray(data.customCats)  ? data.customCats  : [];
    if (materials && typeof window._firestoreDataCallback === 'function') {
      window._firestoreDataCallback(materials, customCats);
    }
  } else {
    // 文件不存在：若管理員已登入，就把 localStorage 的資料上傳初始化
    if (window._isAdmin && typeof window._firestoreInitCallback === 'function') {
      window._firestoreInitCallback();
    }
  }
  setSyncStatus('synced');
}, (err) => {
  console.error('Firestore error:', err);
  const loadingEl = document.getElementById('dataLoadingEl');
  if (loadingEl) loadingEl.remove();
  setSyncStatus('offline');
  if (typeof window._firestoreErrorCallback === 'function') window._firestoreErrorCallback();
});

// ── 儲存教材至 Firestore ──
window.saveDataToFirestore = async function(materials) {
  setSyncStatus('saving');
  try {
    await setDoc(portalDoc, { materials }, { merge: true });
    setSyncStatus('synced');
  } catch(e) {
    console.error('Firestore save failed:', e);
    setSyncStatus('error');
  }
};

// ── 儲存自訂類別至 Firestore ──
window.saveCatsToFirestore = async function(cats) {
  const defaultKeys = ['三年級','四年級','五年級','六年級','教學應用','休閒（動動腦）'];
  const extra = cats.filter(c => !defaultKeys.includes(c.key));
  setSyncStatus('saving');
  try {
    await setDoc(portalDoc, { customCats: extra }, { merge: true });
    setSyncStatus('synced');
  } catch(e) {
    console.error('Firestore cats save failed:', e);
    setSyncStatus('error');
  }
};

// ── 監聽登入狀態 ──
onAuthStateChanged(auth, (user) => {
  if (user && user.email === ALLOWED_EMAIL) {
    document.getElementById('userAvatar').src = user.photoURL || '';
    document.getElementById('userAvatar').style.display = 'inline-block';
    document.getElementById('btnSignOut').style.display  = 'inline-block';
    window._isAdmin = true;
    document.getElementById('export-pack-box').style.display = 'block';
    if (window._pendingManage) { window._pendingManage = false; openManagePanel(); }
  } else {
    document.getElementById('userAvatar').style.display = 'none';
    document.getElementById('btnSignOut').style.display  = 'none';
    window._isAdmin = false;
    document.getElementById('export-pack-box').style.display = 'none';
    closeManagePanel();
  }
});

// ── Google 登入 ──
window.doGoogleLogin = async function() {
  const errEl  = document.getElementById('loginError');
  const loadEl = document.getElementById('loginLoading');
  const btnEl  = document.getElementById('btnGoogleLogin');
  errEl.textContent = '';
  btnEl.style.display  = 'none';
  loadEl.style.display = 'block';
  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;
    if (user.email !== ALLOWED_EMAIL) {
      await fbSignOut(auth);
      loadEl.style.display = 'none';
      btnEl.style.display  = 'flex';
      errEl.textContent = `❌ 此帳號 (${user.email}) 沒有管理權限`;
      return;
    }
    document.getElementById('loginOverlay').classList.add('hidden');
    loadEl.style.display = 'none';
    btnEl.style.display  = 'flex';
  } catch(e) {
    loadEl.style.display = 'none';
    btnEl.style.display  = 'flex';
    if (e.code !== 'auth/popup-closed-by-user') errEl.textContent = '登入失敗，請再試一次';
  }
};

// ── 登出 ──
window.signOut = async function() {
  if (!confirm('確定要登出管理後台？')) return;
  await fbSignOut(auth);
};

document.getElementById('btnGoogleLogin').addEventListener('click', window.doGoogleLogin);
</script>

    const extra = customCats;
    localStorage.setItem(CAT_STORE, JSON.stringify(extra));
    injectCatStyles();
    syncCatSelects();
    if (manageOpen) renderCatList();
  }
  buildPage();
  if (manageOpen) renderManageTable();
};

window._firestoreInitCallback = function() {
  if (window.saveDataToFirestore) window.saveDataToFirestore(DATA);
};

// ── Firestore 離線 fallback ──
window._firestoreErrorCallback = function() {

// ── 顏色工具 ──
function catColor(key) { return (CATS.find(c => c.key === key) || {color:'#aaa'}).color; }
function catEmoji(key) { return (CATS.find(c => c.key === key) || {emoji:'📌'}).emoji; }
function lighten(hex) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},0.12)`;
}
function soften(hex) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},0.22)`;
}

function injectCatStyles() {
  let css = '';
  CATS.forEach(cat => {
    const c = cat.color, light = lighten(c);
    css += `.tab-btn[data-cat="${cat.key}"].active{border-left-color:${c};color:${c};}`;
    css += `[data-section="${cat.key}"] .section-title{color:${c};}`;
    css += `[data-section="${cat.key}"] .card-icon{background:${light};}`;
    css += `[data-section="${cat.key}"] .card-arrow{color:${c};opacity:0.8;}`;
  });
  let el = document.getElementById('dynCatStyle');
  if (!el) { el = document.createElement('style'); el.id = 'dynCatStyle'; document.head.appendChild(el); }
  el.textContent = css;
}

// ── 類別管理 ──
function addCategory() {
  const emoji = document.getElementById('catEmoji').value.trim() || '📌';
  const name  = document.getElementById('catName').value.trim();
  if (!name) { alert('請輸入類別名稱'); return; }
  if (CATS.find(c => c.key === name)) { alert('此類別名稱已存在'); return; }
  const color = EXTRA_COLORS[colorIdx % EXTRA_COLORS.length]; colorIdx++;
  CATS.push({ key:name, emoji, desc:name, color, custom:true });
  saveExtraCats(CATS);
  document.getElementById('catEmoji').value = '';
  document.getElementById('catName').value  = '';
  injectCatStyles(); syncCatSelects(); buildPage(); renderCatList();
}

function deleteCategory(key) {
  if (DATA.some(d => d.cat === key)) { alert(`請先刪除「${key}」類別內的所有教材，再刪除此類別。`); return; }
  if (!confirm(`確定刪除類別「${key}」？`)) return;
  CATS = CATS.filter(c => c.key !== key);
  saveExtraCats(CATS);
  injectCatStyles(); syncCatSelects();
  if (currentTab === key) currentTab = CATS[0].key;
  buildPage(); renderCatList();
}

function renderCatList() {
  const el = document.getElementById('catList');
  if (!el) return;
  el.innerHTML = CATS.map(cat => {
    const isDefault = DEFAULT_CATS.find(d => d.key === cat.key);
    const safeKey = cat.key.replace(/'/g,"\'");
    return `<span class="cat-tag${isDefault?' locked':''}" style="background:${cat.color}" id="cattag-${cat.key}">
      <span>${cat.emoji} ${cat.key}</span>
      <button class="cat-tag-rename" onclick="startRenameCategory('${safeKey}')" title="重新命名">✏</button>
      ${!isDefault ? `<button class="cat-tag-del" onclick="deleteCategory('${safeKey}')">✕</button>` : ''}
    </span>`;
  }).join('');
}

function startRenameCategory(key) {
  const cat = CATS.find(c => c.key === key);
  if (!cat) return;
  const tag = document.getElementById('cattag-' + key);
  if (!tag) return;
  const safeKey = key.replace(/'/g,"\'");
  tag.innerHTML = `
    <input class="cat-rename-input" id="rename-input-${key}" value="${cat.key}" maxlength="20" />
    <button class="cat-tag-rename" onclick="confirmRenameCategory('${safeKey}')" title="確認">✔</button>
    <button class="cat-tag-rename" onclick="renderCatList()" title="取消">✕</button>
  `;
  const inp = document.getElementById('rename-input-' + key);
  inp.focus(); inp.select();
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmRenameCategory(key);
    if (e.key === 'Escape') renderCatList();
  });
}

function confirmRenameCategory(key) {
  const inp = document.getElementById('rename-input-' + key);
  if (!inp) return;
  const newName = inp.value.trim();
  if (!newName) { alert('名稱不可為空白'); return; }
  if (newName !== key && CATS.find(c => c.key === newName)) { alert('此類別名稱已存在'); return; }
  const cat = CATS.find(c => c.key === key);
  if (!cat) return;
  const oldKey = cat.key;
  cat.key = newName;
  cat.desc = newName;
  DATA.forEach(d => { if (d.cat === oldKey) d.cat = newName; });
  if (currentTab === oldKey) currentTab = newName;
  saveExtraCats(CATS);
  if (window.saveDataToFirestore) window.saveDataToFirestore(DATA);
  injectCatStyles(); syncCatSelects(); buildPage(); renderCatList();
}

function syncCatSelects() {
  const opts       = CATS.map(c => `<option value="${c.key}">${c.emoji} ${c.key}</option>`).join('');
  const filterOpts = `<option value="">全部類別</option>` + CATS.map(c => `<option value="${c.key}">${c.key}</option>`).join('');
  const batchOpts  = `<option value="">移動到…</option>` + CATS.map(c => `<option value="${c.key}">${c.emoji} ${c.key}</option>`).join('');
  const addCatEl   = document.getElementById('addCat');
  const filterEl   = document.getElementById('filterCat');
  const batchEl    = document.getElementById('batchMoveCat');
  if (addCatEl) addCatEl.innerHTML = opts;
  if (filterEl) filterEl.innerHTML = filterOpts;
  if (batchEl)  batchEl.innerHTML  = batchOpts;
}

// ── 建立頁面 ──
function buildPage() {
  tabBar.innerHTML = '';
  contentArea.innerHTML = '';
  injectCatStyles();
  CATS.forEach(cat => {
    const items = DATA.filter(d => d.cat === cat.key);
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (cat.key === currentTab ? ' active' : '');
    btn.dataset.cat = cat.key;
    btn.innerHTML = `${cat.emoji} ${cat.key} <span class="tab-count">${items.length}</span>`;
    btn.addEventListener('click', () => switchTab(cat.key));
    tabBar.appendChild(btn);

    const section = document.createElement('section');
    section.className = 'category-section' + (cat.key === currentTab ? ' active' : '');
    section.dataset.section = cat.key;
    const cardsHtml = items.length === 0
      ? `<div class="empty-state"><div class="empty-icon">📭</div>尚無教材，請點右上角「管理教材」新增</div>`
      : items.map(item => `
        <a class="card" href="${item.url}" target="_blank" rel="noopener">
          <div class="card-icon">${ICON_MAP[item.name] || item.icon}</div>
          <div class="card-name">${item.name}</div>
          <div class="card-arrow">↗</div>
        </a>`).join('');
    section.innerHTML = `
      <div class="section-header">
        <span class="section-emoji">${cat.emoji}</span>
        <div>
          <div class="section-title">${cat.key}</div>
          <div class="section-subtitle">${cat.desc} · ${items.length} 個教材</div>
        </div>
      </div>
      <div class="card-grid">${cardsHtml}</div>`;
    contentArea.appendChild(section);
  });
}

function switchTab(catKey) {
  currentTab = catKey;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === catKey));
  document.querySelectorAll('.category-section').forEach(s => s.classList.toggle('active', s.dataset.section === catKey));
}

// ── 管理面板開關 ──
function onManageClick() {
  if (window._isAdmin) {
    toggleManagePanel();
  } else {
    window._pendingManage = true;
    document.getElementById('loginOverlay').classList.remove('hidden');
  }
}

function openManagePanel() {
  manageOpen = true;
  document.getElementById('managePanel').classList.add('open');
  const btn = document.getElementById('manageToggle');
  btn.classList.add('active');
  btn.textContent = '✕ 關閉管理';
  syncCatSelects(); renderManageTable(); renderCatList();
}

function closeManagePanel() {
  manageOpen = false;
  document.getElementById('managePanel').classList.remove('open');
  const btn = document.getElementById('manageToggle');
  btn.classList.remove('active');
  btn.textContent = '⚙️ 管理教材';
}

function toggleManagePanel() { manageOpen ? closeManagePanel() : openManagePanel(); }

// ── 管理表格 ──
let filteredIndices = [];

function renderManageTable() {
  const filter   = document.getElementById('filterCat').value;
  const filtered = DATA.map((item, i) => ({item, i})).filter(({item}) => !filter || item.cat === filter);
  filteredIndices = filtered.map(f => f.i);
  document.getElementById('listCount').textContent = `共 ${filtered.length} 筆（全部 ${DATA.length} 筆）`;
  const tbody = document.getElementById('manageTableBody');
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:24px;color:#999;">此類別尚無教材</td></tr>`;
    updateBatchBar(); return;
  }
  tbody.innerHTML = filtered.map(({item, i}) => {
    const color    = catColor(item.cat);
    const moveOpts = CATS.filter(c => c.key !== item.cat).map(c => `<option value="${c.key}">${c.emoji} ${c.key}</option>`).join('');
    return `<tr data-idx="${i}">
      <td><input type="checkbox" class="row-cb" data-idx="${i}" onchange="onRowCheck(event)"></td>
      <td><span class="cat-badge" style="background:${color}">${item.cat}</span></td>
      <td class="td-name" id="namecell-${i}">${item.icon} ${item.name}</td>
      <td class="td-url"><a href="${item.url}" target="_blank" rel="noopener">${item.url}</a></td>
      <td><div class="td-actions">
        <select class="move-select" onchange="moveItem(${i},this.value)" title="移動到其他類別">
          <option value="">📂 移到…</option>${moveOpts}
        </select>
        <button class="btn-rename" onclick="startRename(${i})">✏️ 改名</button>
        <button class="btn-del" onclick="deleteItem(${i})">刪除</button>
      </div></td>
    </tr>`;
  }).join('');
  updateBatchBar(); syncCheckAll();
}

// ── 重新命名 ──
function startRename(idx) {
  const cell = document.getElementById(`namecell-${idx}`);
  if (!cell) return;
  const item = DATA[idx];
  cell.innerHTML = `<div class="rename-wrap">
    <input class="rename-input" id="renameInput-${idx}" value="${item.name.replace(/"/g,'&quot;')}" maxlength="40">
    <button class="btn-confirm-sm" onclick="confirmRename(${idx})">✓</button>
    <button class="btn-cancel-sm"  onclick="cancelRename(${idx})">✕</button>
  </div>`;
  const input = document.getElementById(`renameInput-${idx}`);
  input.focus();
  input.select();
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter')  confirmRename(idx);
    if (e.key === 'Escape') cancelRename(idx);
  });
}

function confirmRename(idx) {
  const input = document.getElementById(`renameInput-${idx}`);
  if (!input) return;
  const newName = input.value.trim();
  if (!newName) { alert('名稱不可為空'); return; }
  DATA[idx].name = newName;
  saveData(DATA);
  buildPage();
  renderManageTable();
  showToast(`✅ 已改名為「${newName}」`);
}

function cancelRename(idx) {
  renderManageTable();
}

// ── 單筆移動 ──
function moveItem(idx, newCat) {
  if (!newCat) return;
  DATA[idx].cat  = newCat;
  DATA[idx].icon = catEmoji(newCat);
  saveData(DATA); buildPage(); renderManageTable();
  showToast(`✅ 已移至「${newCat}」`);
}

// ── 批次移動 ──
function batchMove() {
  const indices = getCheckedIndices();
  const newCat  = document.getElementById('batchMoveCat').value;
  if (indices.length === 0) { alert('請先勾選要移動的教材'); return; }
  if (!newCat) { alert('請選擇要移動到的類別'); return; }
  const names   = indices.map(i => DATA[i].name);
  const preview = names.length <= 5 ? names.join('、') : names.slice(0,5).join('、') + `…等 ${names.length} 筆`;
  if (!confirm(`確定將以下 ${indices.length} 筆教材移到「${newCat}」？\n\n${preview}`)) return;
  indices.forEach(i => { DATA[i].cat = newCat; DATA[i].icon = catEmoji(newCat); });
  saveData(DATA); buildPage(); clearSelection(); renderManageTable();
}

// ── 新增 / 刪除 ──
function addItem() {
  const cat  = document.getElementById('addCat').value.trim();
  const name = document.getElementById('addName').value.trim();
  const url  = document.getElementById('addUrl').value.trim();
  if (!name) { alert('請輸入教材名稱'); return; }
  if (!url)  { alert('請輸入網址'); return; }
  if (!url.startsWith('http')) { alert('網址需以 http 或 https 開頭'); return; }
  DATA.push({ cat, name, url, icon: catEmoji(cat) });
  saveData(DATA);
  document.getElementById('addName').value = '';
  document.getElementById('addUrl').value  = '';
  buildPage(); renderManageTable(); switchTab(cat);
  showToast('✅ 已新增！');
}

function deleteItem(idx) {
  if (!confirm(`確定刪除「${DATA[idx].name}」？`)) return;
  DATA.splice(idx, 1);
  saveData(DATA); buildPage(); renderManageTable();
}

// ── 批次刪除 ──
function batchDelete() {
  const indices = getCheckedIndices();
  if (indices.length === 0) return;
  const names   = indices.map(i => DATA[i].name);
  const preview = names.length <= 5 ? names.join('、') : names.slice(0,5).join('、') + `…等 ${names.length} 筆`;
  if (!confirm(`確定刪除以下 ${indices.length} 筆教材？\n\n${preview}`)) return;
  indices.sort((a,b) => b-a).forEach(i => DATA.splice(i, 1));
  saveData(DATA); buildPage(); renderManageTable();
}

// ── 勾選工具 ──
function onRowCheck(event) {
  const row = event.target.closest('tr');
  row.classList.toggle('row-checked', event.target.checked);
  updateBatchBar(); syncCheckAll();
}
function toggleAll(masterCb) {
  document.querySelectorAll('.row-cb').forEach(cb => {
    cb.checked = masterCb.checked;
    cb.closest('tr').classList.toggle('row-checked', masterCb.checked);
  });
  updateBatchBar();
}
function syncCheckAll() {
  const cbs   = [...document.querySelectorAll('.row-cb')];
  const allCb = document.getElementById('checkAll');
  if (!allCb || cbs.length === 0) { if (allCb) allCb.checked = false; return; }
  const n = cbs.filter(c => c.checked).length;
  allCb.checked       = n === cbs.length;
  allCb.indeterminate = n > 0 && n < cbs.length;
}
function getCheckedIndices() {
  return [...document.querySelectorAll('.row-cb:checked')].map(cb => parseInt(cb.dataset.idx));
}
function updateBatchBar() {
  const checked = getCheckedIndices();
  document.getElementById('batchBar').classList.toggle('show', checked.length > 0);
  document.getElementById('batchCount').textContent = `已選 ${checked.length} 筆`;
}
function clearSelection() {
  document.querySelectorAll('.row-cb').forEach(cb => { cb.checked = false; cb.closest('tr').classList.remove('row-checked'); });
  const allCb = document.getElementById('checkAll');
  if (allCb) { allCb.checked = false; allCb.indeterminate = false; }
  updateBatchBar();
}

// ── Toast 提示 ──
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => { toast.classList.remove('show'); toast.textContent = '✅ 已新增！'; }, 2200);
}

// ── 匯出 ──
function exportData() {
  const text = JSON.stringify(DATA, null, 2);
  navigator.clipboard.writeText(text).then(() => {
    alert('✅ 已複製到剪貼板！共 ' + DATA.length + ' 筆教材資料。');
  }).catch(() => { prompt('請手動複製以下資料：', text); });
}

// ── 一鍵打包匯出 ──
function exportPack(format) {
  const _d = new Date();
  const date = `${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}-${String(_d.getDate()).padStart(2,'0')}`;
  const cats = CATS.map(cat => ({
    key: cat.key, emoji: cat.emoji, desc: cat.desc, color: cat.color,
    items: DATA.filter(d => d.cat === cat.key)
  }));

  if (format === 'md') {
    let md = `# 🐻 黑熊老師自然科學數位教材中心\n\n> 匯出時間：${date}　·　共 ${DATA.length} 個教材\n\n---\n\n`;
    cats.forEach(cat => {
      md += `## ${cat.emoji} ${cat.key}\n\n`;
      if (cat.items.length === 0) { md += '_（尚無教材）_\n\n'; return; }
      cat.items.forEach(item => { md += `- [${item.name}](${item.url})\n`; });
      md += '\n';
    });
    downloadExport('﻿' + md, `science-portal_${date}.md`, 'text/markdown');

  } else if (format === 'html') {
    downloadExport(buildExportHtml(cats, date, false), `science-portal_${date}.html`, 'text/html');

  } else if (format === 'pdf') {
    const win = window.open('', '_blank');
    win.document.write(buildExportHtml(cats, date, true));
    win.document.close();
    win.focus();
    setTimeout(() => { win.print(); }, 600);

  } else if (format === 'docx') {
    downloadExport(buildExportHtml(cats, date, true), `science-portal_${date}.doc`, 'application/msword');
  }
}

function downloadExport(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function buildExportHtml(cats, date, forPrint) {
  const catSections = cats.map(cat => {
    const items = cat.items.map(item =>
      `<li><a href="${item.url}"${forPrint ? '' : ' target="_blank"'}>${item.name}</a></li>`
    ).join('');
    return `<section>
      <h2 style="color:${cat.color};margin:32px 0 10px;font-size:18px;display:flex;align-items:baseline;gap:8px;border-bottom:2px solid ${cat.color};padding-bottom:6px;">
        ${cat.emoji} ${cat.key}
        <span style="color:#888;font-size:13px;font-weight:400;">${cat.items.length} 個教材</span>
      </h2>
      ${cat.items.length ? `<ul style="margin:8px 0 0;padding-left:22px;line-height:2.1;">${items}</ul>` : '<p style="color:#888;margin:8px 0;">（尚無教材）</p>'}
    </section>`;
  }).join('');

  return `<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>science-portal_${date}</title>
<style>
  body{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;max-width:800px;margin:40px auto;padding:0 28px 60px;color:#1a1a2e;line-height:1.7;font-size:15px;}
  h1{font-size:24px;color:#111;margin-bottom:4px;font-weight:900;}
  .meta{color:#666;font-size:13px;margin-bottom:32px;padding-bottom:16px;border-bottom:1px solid #e5e7eb;}
  a{color:#0070f3;text-decoration:none;}
  a:hover{text-decoration:underline;}
  li{padding:1px 0;}
  @media print{
    body{margin:0;padding:20px;}
    a{color:#1a1a2e;}
    h2{break-after:avoid;}
    section{break-inside:avoid;}
    @page{margin:18mm 20mm;}
  }
</style>
</head>
<body>
<h1>🐻 黑熊老師自然科學數位教材中心</h1>
<div class="meta">匯出時間：${date}　·　共 ${DATA.length} 個教材</div>
${catSections}
</body>
</html>`;
}
